<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Milestone — bienestar financiero.">
  <!-- Le dice al navegador que la app ya maneja su propio modo claro/oscuro,
       para que Chrome no aplique su heurística de "forzar oscuro" sobre el
       canvas de Flutter (eso es lo que rompía los colores del splash). -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1E2040" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F1F4" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="milestone">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Milestone</title>
  <link rel="manifest" href="manifest.json">

  <!-- Captura el prompt nativo de "instalar app" del navegador (Chrome/
       Edge/Android) para poder dispararlo desde el botón "Descargar
       app" del sheet de Flutter en vez de esperar a que el navegador
       lo muestre solo. Safari/iOS no dispara este evento — ahí el
       sheet cae al flujo manual de "Agregar a inicio". -->
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.deferredInstallPrompt = event;
    });
    window.pwaInstallAvailable = function () {
      return !!window.deferredInstallPrompt;
    };
    window.triggerPwaInstall = async function () {
      var promptEvent = window.deferredInstallPrompt;
      if (!promptEvent) return false;
      promptEvent.prompt();
      var choice = await promptEvent.userChoice;
      window.deferredInstallPrompt = null;
      return choice.outcome === 'accepted';
    };
    window.pwaAlreadyInstalled = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
